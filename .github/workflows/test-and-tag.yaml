name: Test and Tag

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Name'
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'stable'

env:
  BTP_URL: https://api.cf.us10.hana.ondemand.com
  CF_ORG: en06-dev-aws
  CF_SPACE: dev

jobs:
  test-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get Secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            cef670b6-a372-4ee7-8d86-b1a000f56a3c > CF_USERNAME
            6db2a260-106e-4a5a-b612-b1a000f5a374 > CF_PASSWORD
      
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Test deployment success comment
        uses: $/
        with:
          api: ${{ env.BTP_URL }}
          username: ${{ env.CF_USERNAME }}
          password: ${{ env.CF_PASSWORD }}
          org: ${{ env.CF_ORG }}
          space: ${{ env.CF_SPACE }}
          manifest: 'manifest.yml'
          command: |
            expected='https://example.com/r3; scratch.my.salesforce.com; scratch.lightning.force.com'
            cf set-env ghac-btp-deploy-pr SCRIPT_TEST "$expected"
            cf env ghac-btp-deploy-pr | grep -F -- "SCRIPT_TEST: $expected"
            cf unset-env ghac-btp-deploy-pr SCRIPT_TEST

      - name: Test command pipeline failure
        id: command-failure
        continue-on-error: true
        uses: $/
        with:
          api: ${{ env.BTP_URL }}
          username: ${{ env.CF_USERNAME }}
          password: ${{ env.CF_PASSWORD }}
          org: ${{ env.CF_ORG }}
          space: ${{ env.CF_SPACE }}
          command: |
            false | true
            exit 0

      - name: Verify command failure propagation
        env:
          COMMAND_OUTCOME: ${{ steps.command-failure.outcome }}
        run: test "$COMMAND_OUTCOME" = failure

      - name: Test deployment failure comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: $/
        with:
          api: ${{ env.BTP_URL }}
          username: ${{ env.CF_USERNAME }}
          password: ${{ env.CF_PASSWORD }}
          org: ${{ env.CF_ORG }}
          space: ${{ env.CF_SPACE }}
          manifest: 'nonexistent-manifest.yml'
          
      - name: Cleanup test deployment for PR
        uses: $/
        with:
          api: ${{ env.BTP_URL }}
          username: ${{ env.CF_USERNAME }}
          password: ${{ env.CF_PASSWORD }}
          org: ${{ env.CF_ORG }}
          space: ${{ env.CF_SPACE }}
          command: cf delete ghac-btp-deploy-pr -f -r
          
      - name: Create tag
        if: github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ inputs.tag }}
        with:
          script: |
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.TAG_NAME}`,
                sha: context.sha,
              })
            } catch (err) {
              console.log(err)

              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${process.env.TAG_NAME}`,
                sha: context.sha,
              })
            }
